<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lumi</title>
    <!--
      GitHub Pages has no server-side router, so it 404s on any deep link
      or refresh of a client-side route (e.g. /Lumi/login). This script
      is the standard spa-github-pages redirect trick: it stashes the
      real path in sessionStorage and bounces to the app root, where the
      inline script in index.html restores it via history.replaceState
      before React Router ever sees the URL.
    -->
    <script>
      var pathSegmentsToKeep = 1; // keep "/Lumi" (the GitHub Pages project prefix)
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
